name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-android:
    name: Build Linux server and Android APK
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasio-dev libwxgtk3.2-dev zip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"

      - name: Build packages
        timeout-minutes: 20
        run: ./build.sh --release --clean

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mousedroid-linux-android-packages
          path: release/packages/*.zip

  windows-server:
    name: Build Windows server
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "c0948694cceff995e5cf90b751e0c5a95d613458"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S server -B build\server-windows -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build\server-windows --config Release

      - name: Package Windows server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/server-windows | Out-Null
          if (Test-Path "build/server-windows/bin/Release/Mousedroid.exe") {
            Copy-Item "build/server-windows/bin/Release/Mousedroid.exe" -Destination release/server-windows/
          } else {
            Copy-Item "build/server-windows/bin/Mousedroid.exe" -Destination release/server-windows/
          }
          if (Test-Path "vcpkg_installed/x64-windows/bin") {
            Get-ChildItem "vcpkg_installed/x64-windows/bin" -Filter "*.dll" | Copy-Item -Destination release/server-windows/ -ErrorAction SilentlyContinue
          }
          if (Test-Path "server/adb") {
            Copy-Item "server/adb" -Destination release/server-windows/ -Recurse
          }
          if (Test-Path "server/app.ico") {
            Copy-Item "server/app.ico" -Destination release/server-windows/
          }
          @"
          MINIMIZE_TASKBAR=0
          MOVE_SENSITIVITY=10
          RUN_STARTUP=0
          SCROLL_SENSITIVITY=3
          "@ | Set-Content -Path release/server-windows/config.ini
          New-Item -ItemType Directory -Force -Path release/packages | Out-Null
          if (Test-Path "release/packages/Mousedroid-server-windows-release.zip") {
            Remove-Item "release/packages/Mousedroid-server-windows-release.zip"
          }
          Compress-Archive -Path release/server-windows -DestinationPath release/packages/Mousedroid-server-windows-release.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mousedroid-windows-server
          path: release/packages/Mousedroid-server-windows-release.zip

  bundle-release:
    name: Publish combined release zip
    runs-on: ubuntu-24.04
    needs:
      - linux-android
      - windows-server
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download linux/android artifacts
        uses: actions/download-artifact@v4
        with:
          name: mousedroid-linux-android-packages
          path: artifacts/linux-android

      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: mousedroid-windows-server
          path: artifacts/windows

      - name: Create combined zip
        run: |
          mkdir -p release
          cp artifacts/linux-android/*.zip release/ || true
          cp artifacts/windows/*.zip release/ || true
          (cd release && zip -qr "Mousedroid-all-${GITHUB_REF_NAME}.zip" *.zip)

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/Mousedroid-all-${{ github.ref_name }}.zip
